[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-jarvis"
version = "0.1.0"
description = "A local Windows Jarvis-style assistant."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
documents = [
    "Pillow>=12.3,<13",
    "pypdfium2>=5.13,<6",
    "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "python-docx>=1.1.2",
    "pypdf>=6.18,<7",
    "openai>=1.0.0",
]
voice = [
    "SpeechRecognition>=3.10",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
    "websockets>=12",
    "sounddevice>=0.4.6",
    "pocketsphinx>=5.0,<6",
]
files = [
    "send2trash>=2.1,<3",
    "pywin32>=311; sys_platform == 'win32'",
]
monitor = [
    "psutil>=5.9",
]
gui = [
    "PySide6>=6.5",
    "local-jarvis[monitor]",
]
browser = [
    "playwright>=1.45",
]
vision = [
    "Pillow>=10",
]
installer = [
    "pyinstaller>=6.0",
    "local-jarvis[gui]",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
